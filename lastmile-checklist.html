<title>Last Mile Migration Checklist</title>
<script>try { const t = localStorage.getItem("lm-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one column, header + two tabs (Summary, Checklist); checklist is a table that becomes cards on phones. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #14171c; --ink-2: #5a6270; --line: #dfe3ea;
  --accent: #c41e3a; --accent-ink: #ffffff;
  --done: #1d7f47; --done-bg: #d9f1e2; --pend: #6d7482; --pend-bg: #eceff3; --na: #8a909c; --na-bg: #f6f7f9;
  --warn: #a35a00; --focus: #2a6fd6; --shadow: 0 1px 2px rgba(20,23,28,.06), 0 4px 16px rgba(20,23,28,.06);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101318; --surface: #191d24; --ink: #e8eaee; --ink-2: #9ca3af; --line: #2b313b;
  --accent: #ff5d72; --accent-ink: #1a0508;
  --done: #5fd08f; --done-bg: #173726; --pend: #a3a9b5; --pend-bg: #252a33; --na: #7d8493; --na-bg: #1d2129;
  --warn: #f0a24a; --focus: #6ea2ff; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101318; --surface: #191d24; --ink: #e8eaee; --ink-2: #9ca3af; --line: #2b313b;
  --accent: #ff5d72; --accent-ink: #1a0508;
  --done: #5fd08f; --done-bg: #173726; --pend: #a3a9b5; --pend-bg: #252a33; --na: #7d8493; --na-bg: #1d2129;
  --warn: #f0a24a; --focus: #6ea2ff; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body) }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em }
h2 { font-size: 16px; font-weight: 700 }
.mono { font-family: var(--f-mono); font-size: 12.5px }
.muted { color: var(--ink-2) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600 }
.who { font-size: 12.5px; color: var(--ink-2); text-align: right }
.top-right { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px }
.theme-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600 }
.theme-btn:hover { border-color: var(--ink-2) }
.theme-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px }
nav.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0,1fr) } }

/* headline */
.hero { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 24px; align-items: center; margin-bottom: 16px }
.big { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums }
.big small { font-size: 22px; color: var(--ink-2); font-weight: 700 }
@media (max-width: 560px) { .hero { grid-template-columns: minmax(0,1fr) } .big { font-size: 44px } }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--pend-bg) }
.bar > span { display: block; height: 100% }
.bar .d { background: var(--done) }
.bar .n { background: repeating-linear-gradient(135deg, var(--na) 0 2px, transparent 2px 6px); opacity: .7 }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }

.rows { display: grid; gap: 4px }
.row-btn { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 8px; border-radius: 8px; cursor: pointer }
.row-btn:hover { background: var(--na-bg) }
.row-btn .bar { grid-column: 1 / -1; height: 8px }
.row-btn .lbl { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row-btn .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px }
.hint { font-size: 12px; color: var(--ink-2); margin: 4px 0 10px }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0 }
.field, .toolbar select, .toolbar input[type=search] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--ink-2) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600 }
.btn:hover { border-color: var(--ink-2) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.spacer { flex: 1 }
.count { font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px }
.chipfilter { display: inline-flex; align-items: center; gap: 6px; background: var(--pend-bg); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 12.5px }
.chipfilter button { border: 0; background: none; cursor: pointer; padding: 0 6px; font-size: 14px; color: var(--ink-2) }

/* filter bar */
.filterbar { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px }
.filterbar .toolbar { margin: 0 }
.filterbar label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2) }
.listhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px }
.sub { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere }

/* laptop cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; align-items: start }
.card { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; min-width: 0 }
.card:hover { border-color: color-mix(in srgb, var(--ink-2) 55%, var(--line)) }
.card.complete { border-color: color-mix(in srgb, var(--done) 45%, var(--line)) }
.card-head { display: flex; justify-content: space-between; align-items: start; gap: 8px }
.card-tag { font-family: var(--f-mono); font-weight: 500; font-size: 15px; letter-spacing: .01em }
.card-loc { font-size: 12.5px; color: var(--ink-2) }
.status { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px }
.status.s-done { background: var(--done-bg); color: var(--done) }
.status.s-prog { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn) }
.status.s-new { background: var(--pend-bg); color: var(--pend) }
.card-meta { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 10px; font-size: 12.5px; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.card-meta dt { color: var(--ink-2) }
.card-meta dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card-meta dd.mono { font-size: 12px }
.checks { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.card-foot { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line) }
.card-prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums }
.card-prog .bar { flex: 1; height: 6px }
.card-note { font-size: 12.5px; color: var(--ink-2); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.card-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2) }
.link-btn { border: 0; background: none; color: var(--focus); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 12.5px }
.link-btn:hover { text-decoration: underline }

/* tick-box step rows (cards + detail panel) */
.step-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 6px; cursor: pointer; font-size: 13.5px }
.step-btn:hover:not(:disabled) { background: var(--na-bg) }
.step-btn:disabled { cursor: default }
.box { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid color-mix(in srgb, var(--ink-2) 70%, transparent); background: var(--surface) }
.box svg { width: 12px; height: 12px; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
.step-btn[data-s="done"] .box { background: var(--done); border-color: var(--done) }
.step-btn[data-s="done"] .box svg { stroke: var(--surface) }
.step-btn[data-s="na"] .box { border-style: dashed; border-color: var(--na) }
.step-btn[data-s="na"] .box svg { stroke: var(--na) }
.step-btn .lbl { flex: 1; min-width: 0 }
.step-btn[data-s="na"] .lbl { color: var(--na); text-decoration: line-through }
.step-btn .state { font-size: 11px; color: var(--ink-2) }
.step-btn[data-s="done"] .state { color: var(--done); font-weight: 600 }

.empty { text-align: center; padding: 48px 16px; color: var(--ink-2) }
.empty h2 { color: var(--ink); margin-bottom: 6px }

/* drawer */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, 100%); max-width: 100%; height: 100%; max-height: 100%; margin: 0 0 0 auto; box-shadow: var(--shadow) }
dialog::backdrop { background: rgba(10,12,16,.45) }
.dlg { display: flex; flex-direction: column; height: 100% }
.dlg-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: start; justify-content: space-between }
.dlg-body { padding: 16px 20px; overflow-y: auto; display: grid; gap: 18px; flex: 1 }
.dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center }
dl.kv { display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 6px 12px; margin: 0; font-size: 13px }
dl.kv dt { color: var(--ink-2) }
dl.kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line }
.steps { display: grid; gap: 6px }
.form { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px }
.form label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 600 }
.form .full { grid-column: 1 / -1 }
.form input, .form textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-weight: 400; color: var(--ink) }
.form textarea { min-height: 84px; resize: vertical }
@media (max-width: 480px) { .form { grid-template-columns: minmax(0,1fr) } dl.kv { grid-template-columns: minmax(0,1fr) } dl.kv dt { margin-top: 4px } }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 4px 8px }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .4s ease } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Windows 11 · Last Mile laptops</div>
      <h1>Last Mile Migration Checklist</h1>
    </div>
    <div class="top-right">
      <div class="who" id="who">Connecting…</div>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to night mode"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-summary" aria-selected="true" data-tab="summary">Summary</button>
    <button role="tab" id="tab-list" aria-selected="false" data-tab="list">Checklist</button>
  </nav>

  <section id="view-summary"></section>

  <section id="view-list" hidden>
    <div class="filterbar">
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search tag, serial, user, hub, ticket…" aria-label="Search">
        <select id="f-region" aria-label="Region"></select>
        <select id="f-hub" aria-label="Hub"></select>
        <label class="inline" for="f-sort">Sort by
          <select id="f-sort">
            <option value="region">Region, then hub</option>
            <option value="hub">Hub</option>
            <option value="least">Least done first</option>
            <option value="most">Most done first</option>
            <option value="tag">Tag number</option>
            <option value="recent">Recently changed</option>
          </select>
        </label>
      </div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Show">
          <button data-show="open" aria-pressed="true">Not complete</button>
          <button data-show="done" aria-pressed="false">Complete</button>
          <button data-show="all" aria-pressed="false">All</button>
        </div>
        <span id="active-filters" hidden></span>
        <span class="spacer"></span>
        <button class="btn" id="btn-export">Download Excel</button>
        <button class="btn" id="btn-upload" hidden>Upload workbook</button>
        <input type="file" id="file" accept=".xlsx,.xls" hidden>
      </div>
    </div>
    <div class="listhead"><div class="count" id="count"></div></div>
    <div id="list"></div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
const STEPS = [
  { key: "ret",     label: "Return to IT",       short: "Return to IT" },
  { key: "repl",    label: "Replacement to hub", short: "Replacement" },
  { key: "win11",   label: "Win 11 updated",     short: "Win 11" },
  { key: "snipe",   label: "Snipe-IT updated",   short: "Snipe-IT" },
];
const STATE_LABEL = { pending: "Pending", done: "Done", na: "N/A" };
const NEXT = { pending: "done", done: "na", na: "pending" };
const EDIT_FIELDS = ["latestUser", "remarks", "newSerial", "newTag", "ticket", "tn"];

let DB = null, USER = null, DL = null, CAN_WRITE = false, IS_ADMIN = false, ME = null;
let BASE = { meta: null, rows: [] }, EDITS = {}, LAPTOPS = [];
const F = { q: "", region: "", hub: "", show: "open", step: "", sort: "region" };
let openTag = null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); };
const short = e => (e || "").replace(/@.*$/, "");
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

// ---------- merge base + edits ----------
function merge() {
  LAPTOPS = BASE.rows.map(b => {
    const e = EDITS[b.tag] || {};
    const l = { ...b, steps: { ...b.steps, ...(e.steps || {}) }, by: e.by, at: e.at };
    for (const k of EDIT_FIELDS) if (k in e) l[k] = e[k];
    l.complete = STEPS.every(s => l.steps[s.key] !== "pending");
    l.started = STEPS.some(s => l.steps[s.key] === "done");
    l.need = STEPS.filter(s => l.steps[s.key] !== "na").length;      // steps that apply to this laptop
    l.doneN = STEPS.filter(s => l.steps[s.key] === "done").length;
    l.progress = l.need ? l.doneN / l.need : 1;
    return l;
  });
}
const isComplete = l => l.complete;

// ---------- summary ----------
function barHTML(done, na, total) {
  const p = n => total ? (n / total * 100).toFixed(2) + "%" : "0%";
  return `<div class="bar" role="img" aria-label="${done} done, ${na} not needed, ${total - done - na} pending"><span class="d" style="width:${p(done)}"></span><span class="n" style="width:${p(na)}"></span></div>`;
}
function renderSummary() {
  const v = $("#view-summary");
  if (!LAPTOPS.length) { v.innerHTML = emptyHTML(); bindEmpty(v); return; }
  const n = LAPTOPS.length, c = LAPTOPS.filter(isComplete).length;
  const started = LAPTOPS.filter(l => !l.complete && l.started).length;
  const pct = Math.round(c / n * 100);
  const stepRows = STEPS.map(s => {
    const d = LAPTOPS.filter(l => l.steps[s.key] === "done").length;
    const na = LAPTOPS.filter(l => l.steps[s.key] === "na").length;
    return `<button class="row-btn" data-step="${s.key}"><span class="lbl">${s.label}</span><span class="num">${d} done${na ? ` · ${na} N/A` : ""} · <b>${n - d - na} pending</b></span>${barHTML(d, na, n)}</button>`;
  }).join("");
  const regions = groupBy(LAPTOPS, l => l.region);
  const regRows = [...regions].sort((a, b) => (a[1].filter(isComplete).length / a[1].length) - (b[1].filter(isComplete).length / b[1].length) || a[0].localeCompare(b[0]))
    .map(([r, ls]) => { const k = ls.filter(isComplete).length; return `<button class="row-btn" data-region="${esc(r)}"><span class="lbl">${esc(r)}</span><span class="num">${k} / ${ls.length} complete</span>${barHTML(k, 0, ls.length)}</button>`; }).join("");
  v.innerHTML = `
    <div class="panel hero">
      <div class="big">${c}<small> / ${n}</small></div>
      <div>
        <h2>laptops complete (${pct}%)</h2>
        <div class="hint">A laptop is complete when all ${STEPS.length} steps are Done or N/A. ${started} more are in progress, ${n - c - started} not started.</div>
        ${barHTML(c, 0, n)}
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Progress by step</h2><p class="hint">Click a step to see the laptops still waiting on it.</p>
        <div class="rows">${stepRows}</div>
        <div class="legend"><span><i style="background:var(--done)"></i>Done</span><span><i style="background:repeating-linear-gradient(135deg,var(--na) 0 2px,transparent 2px 5px)"></i>Not needed</span><span><i style="background:var(--pend-bg);border:1px solid var(--line)"></i>Pending</span></div>
      </div>
      <div class="panel"><h2>Progress by region</h2><p class="hint">Least finished first. Click a region to open its laptops.</p>
        <div class="rows">${regRows}</div>
      </div>
    </div>
    ${BASE.meta ? `<p class="hint" style="margin-top:16px">Data loaded from ${esc(BASE.meta.file || "workbook")} on ${esc(fmtTime(BASE.meta.at))}${BASE.meta.by ? " by " + esc(short(BASE.meta.by)) : ""}.</p>` : ""}`;
  v.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { Object.assign(F, { step: b.dataset.step, region: "", hub: "", q: "", show: "all" }); go("list"); });
  v.querySelectorAll("[data-region]").forEach(b => b.onclick = () => { Object.assign(F, { region: b.dataset.region, step: "", hub: "", q: "", show: "all" }); go("list"); });
}
function groupBy(arr, fn) { const m = new Map(); for (const x of arr) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

function emptyHTML() {
  return `<div class="panel empty"><h2>No laptops loaded yet</h2>
    <p>${IS_ADMIN ? "Upload the Last Mile workbook (.xlsx) to fill the checklist. You only need to do this once." : "An admin needs to upload the Last Mile workbook first. Check back soon."}</p>
    ${IS_ADMIN ? '<button class="btn primary" data-upload>Upload workbook</button>' : ""}</div>`;
}
function bindEmpty(root) { root.querySelectorAll("[data-upload]").forEach(b => b.onclick = () => $("#file").click()); }

// ---------- checklist ----------
const byText = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
const SORTS = {
  region: (a, b) => byText(a.region, b.region) || byText(a.hub, b.hub) || byText(a.tag, b.tag),
  hub:    (a, b) => byText(a.hub, b.hub) || byText(a.tag, b.tag),
  least:  (a, b) => a.progress - b.progress || byText(a.region, b.region) || byText(a.tag, b.tag),
  most:   (a, b) => b.progress - a.progress || byText(a.region, b.region) || byText(a.tag, b.tag),
  tag:    (a, b) => byText(a.tag, b.tag),
  recent: (a, b) => String(b.at || "").localeCompare(String(a.at || "")) || byText(a.tag, b.tag),
};
function filtered() {
  const q = F.q.trim().toLowerCase();
  return LAPTOPS.filter(l => {
    if (F.region && l.region !== F.region) return false;
    if (F.hub && l.hub !== F.hub) return false;
    if (F.step && l.steps[F.step] !== "pending") return false;
    if (F.show === "open" && l.complete) return false;
    if (F.show === "done" && !l.complete) return false;
    if (q) {
      const hay = [l.tag, l.serial, l.assigned, l.latestUser, l.lastSync, l.hub, l.region, l.brand, l.model, l.remarks, l.ticket, l.newSerial, l.newTag, l.tn].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(SORTS[F.sort] || SORTS.region);
}
const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const DASH = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8"/></svg>';
function stepBtn(l, s) {
  const st = l.steps[s.key];
  return `<button type="button" class="step-btn" data-tag="${esc(l.tag)}" data-k="${s.key}" data-s="${st}" ${CAN_WRITE ? "" : "disabled"}
    role="checkbox" aria-checked="${st === "done" ? "true" : st === "na" ? "mixed" : "false"}"
    title="${CAN_WRITE ? "Click to change: Pending → Done → Not needed" : esc(STATE_LABEL[st])}">
    <span class="box">${st === "done" ? TICK : st === "na" ? DASH : ""}</span>
    <span class="lbl">${esc(s.label)}</span><span class="state">${st === "pending" ? "" : st === "na" ? "Not needed" : "Done"}</span></button>`;
}
function statusPill(l) {
  return l.complete ? '<span class="status s-done">Complete</span>' : l.started ? '<span class="status s-prog">In progress</span>' : '<span class="status s-new">Not started</span>';
}
function cardHTML(l) {
  const note = [l.ticket, l.remarks].filter(Boolean).join(" · ");
  return `<article class="card${l.complete ? " complete" : ""}" aria-label="Laptop ${esc(l.tag)}">
    <div class="card-head">
      <div style="min-width:0"><div class="card-tag">${esc(l.tag)}</div><div class="card-loc">${esc(l.region)} · ${esc(l.hub)}</div></div>
      ${statusPill(l)}
    </div>
    <dl class="card-meta">
      <dt>User</dt><dd title="${esc(l.assigned)}">${esc(short(l.assigned)) || "—"}</dd>
      ${l.latestUser ? `<dt>Latest</dt><dd title="${esc(l.latestUser)}">${esc(short(l.latestUser).replace(/\s+/g, " "))}</dd>` : ""}
      <dt>Laptop</dt><dd>${esc([l.brand, l.model].filter(Boolean).join(" ")) || "—"}</dd>
      <dt>Serial</dt><dd class="mono" title="${esc(l.serial)}">${esc(l.serial) || "—"}</dd>
    </dl>
    <div class="checks" role="group" aria-label="Checklist for ${esc(l.tag)}">${STEPS.map(s => stepBtn(l, s)).join("")}</div>
    <div class="card-foot">
      <div class="card-prog"><span>${l.doneN} of ${l.need} done</span>${barHTML(l.doneN, 0, l.need || 1)}</div>
      ${note ? `<div class="card-note">${esc(note)}</div>` : ""}
      <div class="card-actions"><span>${l.at ? `Updated by ${esc(short(l.by))}, ${esc(fmtTime(l.at))}` : "No changes yet"}</span><button type="button" class="link-btn" data-open="${esc(l.tag)}">Details &amp; notes →</button></div>
    </div>
  </article>`;
}
function fillSelect(sel, values, cur, allLabel) {
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
}
function renderList() {
  const regions = [...new Set(LAPTOPS.map(l => l.region))].sort(byText);
  const hubs = [...new Set(LAPTOPS.filter(l => !F.region || l.region === F.region).map(l => l.hub))].sort(byText);
  if (F.hub && !hubs.includes(F.hub)) F.hub = "";
  fillSelect($("#f-region"), regions, F.region, "All regions");
  fillSelect($("#f-hub"), hubs, F.hub, "All hubs");
  $("#f-sort").value = F.sort;
  if ($("#q").value !== F.q) $("#q").value = F.q;
  document.querySelectorAll("[data-show]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.show === F.show)));
  $("#btn-upload").hidden = !IS_ADMIN;

  const af = $("#active-filters");
  const stepName = F.step && STEPS.find(s => s.key === F.step).label;
  af.hidden = !F.step;
  af.innerHTML = F.step ? `<span class="chipfilter">Waiting on: <b>${esc(stepName)}</b><button aria-label="Clear step filter" id="clear-step">×</button></span>` : "";
  if (F.step) $("#clear-step").onclick = () => { F.step = ""; renderList(); };

  const list = $("#list");
  if (!LAPTOPS.length) { $("#count").textContent = ""; list.innerHTML = emptyHTML(); bindEmpty(list); return; }
  const rows = filtered();
  $("#count").textContent = `Showing ${rows.length} of ${LAPTOPS.length} laptops`;
  if (!rows.length) { list.innerHTML = `<div class="panel empty"><h2>No laptops match</h2><p>Try "All" or clear the search and filters.</p></div>`; return; }
  list.innerHTML = `<div class="cards">${rows.map(cardHTML).join("")}</div>`;
}

// ---------- detail drawer ----------
function openDetail(tag) {
  const l = LAPTOPS.find(x => x.tag === tag); if (!l) return;
  openTag = tag;
  const dis = CAN_WRITE ? "" : "disabled";
  const inp = (k, label, cls = "") => `<label class="${cls}">${label}<input id="ed-${k}" value="${esc(l[k])}" ${dis}></label>`;
  $("#dlg").innerHTML = `<form class="dlg" id="dlg-form" method="dialog">
    <div class="dlg-head"><div><div class="eyebrow">${esc(l.region)} · ${esc(l.hub)}</div><h2 id="dlg-title" class="mono" style="font-size:18px">${esc(l.tag)}</h2><div class="sub" id="dlg-last">${lastLine(l)}</div></div><button type="button" class="x" id="dlg-x" aria-label="Close">×</button></div>
    <div class="dlg-body">
      <div><h3 style="font-size:14px;margin-bottom:6px">Checklist</h3><div class="steps" id="dlg-steps">${stepsHTML(l)}</div></div>
      <div><h3 style="font-size:14px;margin-bottom:8px">Laptop</h3><dl class="kv">
        <dt>Serial number</dt><dd class="mono">${esc(l.serial) || "—"}</dd>
        <dt>Brand / model</dt><dd>${esc([l.brand, l.model].filter(Boolean).join(" · ")) || "—"}</dd>
        <dt>Assigned (Snipe-IT)</dt><dd>${esc(l.assigned) || "—"}</dd>
        <dt>Snipe-IT status</dt><dd>${esc(l.snipeStatus) || "—"}</dd>
        <dt>Last sync user</dt><dd>${esc(l.lastSync) || "—"}</dd>
        <dt>Position</dt><dd>${esc(l.position) || "—"}</dd>
      </dl></div>
      <div class="form">
        ${inp("latestUser", "Latest user", "full")}
        <label class="full">Remarks<textarea id="ed-remarks" ${dis}>${esc(l.remarks)}</textarea></label>
      </div>
      <div><h3 style="font-size:14px;margin-bottom:8px">Replacement laptop</h3><div class="form">
        ${inp("newSerial", "New serial no.")}${inp("newTag", "New tag no.")}${inp("ticket", "ISD ticket")}${inp("tn", "TN (tracking no.)")}
      </div></div>
    </div>
    <div class="dlg-foot">${CAN_WRITE ? '<button class="btn primary" id="dlg-save" type="submit" value="save">Save changes</button>' : '<span class="muted">View only</span>'}<button class="btn" type="button" id="dlg-cancel">Close</button></div>
  </form>`;
  const d = $("#dlg");
  d.showModal();
  $("#dlg-x").onclick = $("#dlg-cancel").onclick = () => d.close();
  $("#dlg-form").onsubmit = async ev => {
    ev.preventDefault();
    const changes = {};
    for (const k of EDIT_FIELDS) { const v = $("#ed-" + k).value.trim(); if (v !== (l[k] ?? "")) changes[k] = v; }
    if (!Object.keys(changes).length) { d.close(); return; }
    if (await saveEdit(tag, changes)) { toast("Saved " + tag); d.close(); }
  };
}
function lastLine(l) { return l.at ? `Last change by ${esc(short(l.by))}, ${esc(fmtTime(l.at))}` : "No changes on the web yet"; }
function stepsHTML(l) { return STEPS.map(s => stepBtn(l, s)).join(""); }
$("#dlg").addEventListener("close", () => { openTag = null; });
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
function refreshDetail() {
  if (!openTag) return;
  const l = LAPTOPS.find(x => x.tag === openTag); if (!l) return;
  $("#dlg-steps").innerHTML = stepsHTML(l);
  $("#dlg-last").innerHTML = lastLine(l);
}

// ---------- saving ----------
async function saveEdit(tag, changes) {
  if (!DB || !CAN_WRITE) { toast("Sign in to save changes."); return false; }
  const prev = EDITS[tag] || {};
  const next = { ...prev, ...changes, steps: { ...(prev.steps || {}), ...(changes.steps || {}) } };
  delete next.by; delete next.at;
  EDITS[tag] = { ...next, by: ME, at: new Date().toISOString() };  // optimistic
  rerender();
  try { await DB.collection("edits").doc(tag).set(next); return true; }
  catch (e) { EDITS[tag] = prev; rerender(); toast("Couldn't save. Check your connection and try again."); return false; }
}
document.addEventListener("click", e => {
  const c = e.target.closest(".step-btn[data-k]");
  if (c) {
    e.stopPropagation(); e.preventDefault();
    if (c.disabled) return;
    const l = LAPTOPS.find(x => x.tag === c.dataset.tag);
    saveEdit(l.tag, { steps: { [c.dataset.k]: NEXT[l.steps[c.dataset.k]] } });
    return;
  }
  const r = e.target.closest("[data-open]");
  if (r) openDetail(r.dataset.open);
});

// ---------- workbook upload ----------
const clean = v => String(v ?? "").replace(/\r/g, "").trim();
const flag = v => /^(1|true|yes|y|done)$/i.test(clean(v)) ? "done" : "pending";  // Excel checkboxes come through as TRUE/FALSE
const normRow = r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k.trim().toLowerCase(), clean(v)]));
const brandName = b => clean(b).replace(/^MY\s*-?\s*/i, "").trim();
function parseWorkbook(wb) {
  const sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "", raw: false }).map(normRow));
  const main = sheets.find(r => r.length && "tagging" in r[0] && "win 11 update" in r[0]);
  if (!main) throw new Error("Couldn't find the laptop sheet. It needs the columns Tagging and Win 11 update.");
  const lm = sheets.find(r => r.length && ("tn" in r[0] || "done return" in r[0]) && !("win 11 update" in r[0])) || [];
  const lmByTag = new Map(lm.filter(r => r.tagging).map(r => [r.tagging, r]));
  const seen = new Set(), rows = [];
  for (const r of main) {
    const tag = r.tagging.replace(/\s+/g, "");
    if (!tag || seen.has(tag) || !/^[A-Za-z0-9_\-.~:@+]{1,150}$/.test(tag)) continue;
    seen.add(tag);
    const x = lmByTag.get(tag) || {};
    rows.push({
      tag, region: r.region || x.region || "No region", hub: r.hub || x.hub || x.station || "No hub",
      assigned: r["user assign from snipe it"], serial: r.serialnumber, snipeStatus: r["snipe it status"],
      brand: brandName(r["laptop brand"] || x["laptop brand"]), model: r["laptop model"], lastSync: r["last sync user"],
      dept: r.department, position: r.position || x.position, latestUser: r["latest user"], remarks: r.remarks,
      newSerial: x["serial no."] || "", newTag: x["tagging no."] || "", ticket: x.ticket || "", tn: x.tn || "",
      steps: {
        ret: flag(r["return to it"]),
        repl: /no need replacement/i.test(r.remarks) ? "na" : flag(r["replacement to hub"]),
        win11: flag(r["win 11 update"]),
        snipe: "pending",
      },
    });
  }
  return rows;
}
async function uploadFile(file) {
  if (!IS_ADMIN || !DB) { toast("Only admins can upload the workbook."); return; }
  try {
    const rows = parseWorkbook(XLSX.read(await file.arrayBuffer(), { type: "array" }));
    if (!rows.length) throw new Error("No laptops with a tag were found in the workbook.");
    const CH = 150, chunks = Math.ceil(rows.length / CH);
    const base = DB.collection("base");
    for (let i = 0; i < chunks; i++) await base.doc("p" + i).set({ rows: rows.slice(i * CH, (i + 1) * CH) });
    const oldChunks = BASE.meta?.chunks || 0;
    for (let i = chunks; i < oldChunks; i++) await base.doc("p" + i).delete();
    await base.doc("meta").set({ chunks, count: rows.length, file: file.name, by: ME, at: new Date().toISOString() });
    toast(`Loaded ${rows.length} laptops from ${file.name}`);
  } catch (e) { toast(e.message || "Couldn't read that file."); }
}
$("#file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) uploadFile(f); };
$("#btn-upload").onclick = () => $("#file").click();

// ---------- export ----------
$("#btn-export").onclick = async () => {
  const rows = (LAPTOPS.length ? filtered() : []).map(l => ({
    "Tagging": l.tag, "Region": l.region, "Hub": l.hub, "User assign from snipe it": l.assigned, "Serialnumber": l.serial,
    "Laptop brand": l.brand, "Laptop model": l.model, "Last sync user": l.lastSync, "Position": l.position, "Latest User": l.latestUser,
    ...Object.fromEntries(STEPS.map(s => [s.label, STATE_LABEL[l.steps[s.key]]])),
    "Complete": l.complete ? "Yes" : "No", "Remarks": l.remarks, "New serial": l.newSerial, "New tag": l.newTag, "ISD ticket": l.ticket, "TN": l.tn,
    "Last change by": l.by || "", "Last change at": l.at ? fmtTime(l.at) : "",
  }));
  if (!rows.length) { toast("Nothing to download in this view."); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Checklist");
  const name = `last-mile-checklist-${new Date().toISOString().slice(0, 10)}.xlsx`;
  const blob = new Blob([XLSX.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  if (DL) await DL.save({ filename: name, data: blob }); else toast("Download isn't available here.");
};

// ---------- tabs & filters ----------
function go(tab) {
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#view-summary").hidden = tab !== "summary";
  $("#view-list").hidden = tab !== "list";
  try { localStorage.setItem("lm-tab", tab); } catch (e) {}
  rerender();
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
$("#q").oninput = e => { F.q = e.target.value; renderList(); };
$("#f-region").onchange = e => { F.region = e.target.value; F.hub = ""; renderList(); };
$("#f-hub").onchange = e => { F.hub = e.target.value; renderList(); };
$("#f-sort").onchange = e => { F.sort = e.target.value; try { localStorage.setItem("lm-sort", F.sort); } catch (err) {} renderList(); };
try { const v = localStorage.getItem("lm-sort"); if (v && v in SORTS) F.sort = v; } catch (e) {}
document.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { F.show = b.dataset.show; renderList(); });

function rerender() {
  merge();
  if (!$("#view-summary").hidden) renderSummary();
  if (!$("#view-list").hidden) renderList();
  refreshDetail();
}

// ---------- day / night ----------
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
function paintThemeBtn() {
  const b = $("#theme-btn"), dark = isDark();
  b.innerHTML = dark ? `${SUN}<span>Day mode</span>` : `${MOON}<span>Night mode</span>`;
  b.setAttribute("aria-label", dark ? "Switch to day mode" : "Switch to night mode");
}
$("#theme-btn").onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("lm-theme", next); } catch (e) {}
  paintThemeBtn();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);
paintThemeBtn();

// ---------- boot ----------
(async function boot() {
  try { const t = localStorage.getItem("lm-tab"); if (t === "list") go("list"); } catch (e) {}
  if (!window.claude?.use) { $("#who").textContent = "Offline copy: open the app link to load data"; rerender(); return; }
  [DB, USER, DL] = await Promise.all(["db", "user", "downloads"].map(n => window.claude.use(n).catch(() => null)));
  ME = await USER?.id?.().catch(() => null) ?? null;
  CAN_WRITE = !!DB && !!(await USER?.can?.("data.write").catch(() => false));
  IS_ADMIN = !!(await USER?.canEdit?.().catch(() => false));
  $("#who").innerHTML = ME ? `Signed in as <b>${esc(ME)}</b>${IS_ADMIN ? " · admin" : ""}${CAN_WRITE ? "" : " · view only"}` : (DB ? "Local mode" : "Not signed in");
  rerender();
  if (!DB) return;
  DB.collection("base").onSnapshot(snap => {
    const docs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    const meta = docs.meta || null, rows = [];
    for (let i = 0; i < (meta?.chunks || 0); i++) rows.push(...(docs["p" + i]?.rows || []));
    BASE = { meta, rows };
    rerender();
  });
  DB.collection("edits").limit(1000).onSnapshot(snap => {
    EDITS = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    rerender();
  });
})();
</script>
